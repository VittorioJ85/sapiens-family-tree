name: Validate and package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate metadata and verify package bytes
        run: python3 tools/package.py
      - uses: actions/upload-artifact@v7
        with:
          name: sapiens-family-tree-package
          path: dist/
          if-no-files-found: error
          retention-days: 14
